<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark</title>
</head>

<body>
    <h1>Bookmark</h1>
    <form id="create-bookmark-form">
        <input id="new-bookmark-title" type="text" placeholder="Title" required>
        <input id="new-bookmark-url" type="url" placeholder="URL" required>
        <select id="new-bookmark-category"></select>
        <button type="submit">Add Bookmark</button>
    </form>
    <div id="bookmarks-container">

    </div>
    <script type="module" src="bookmark-script.js"></script>

</body>

</html>
